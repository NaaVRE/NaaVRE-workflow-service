ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  hosts:
    - host: naavre-dev.minikube.test
      paths:
        - path: /my-root-path(/|$)(.*)
          pathType: ImplementationSpecific

conf:
  rootPath: /my-root-path
  virtual_labs_configuration:
    rawJson: |
          {
            "fdo_valid_viz_kinds_url": "https://raw.githubusercontent.com/NaaVRE/NaaVRE-conf/refs/heads/main/fdo_valid_viz_kinds.json",
            "vl_configurations": [
              {
                "name": "openlab",
                "base_image_tags_url": "https://github.com/NaaVRE/flavors/releases/latest/download/base_image_tags.json",
                "module_mapping_url": "https://raw.githubusercontent.com/NaaVRE/NaaVRE-conf/main/module_mapping.json",
                "cell_github_url": "https://github.com/NaaVRE/cells-vl-tests",
                "cell_github_token": "SECRET",
                "registry_url": "ghcr.io/naavre/naavre-cells-vl-tests",
                "wf_engine_config": {
                  "name": "argo",
                  "api_endpoint": "https://naavre-dev.minikube.test/argowf/",
                  "access_token": "SECRET",
                  "service_account": "argo-executor",
                  "namespace": "naavre",
                  "workdir_storage_size": "1Gi",
                  "extraVolumeMounts": [
                    {
                      "name": "naa-vre-public",
                      "readOnly": true,
                      "mountPath": "/home/jovyan/Cloud Storage/naa-vre-public"
                    },
                    {
                      "name": "naa-vre-user-data",
                      "mountPath": "/home/jovyan/Cloud Storage/naa-vre-user-data/",
                      "subPath": "{unescaped_username}"
                    }
                  ],
                  "secrets_creator_api_endpoint": "https://naavre-dev.minikube.test/k8s-secret-creator/1.0.0",
                  "secrets_creator_api_token": "fake-k8sSecretCreator-apiToken"
                }
              },
              {
                "name": "virtual_lab_2",
                "base_image_tags_url": "https://github.com/QCDIS/NaaVRE-flavors/releases/latest/download/base_image_tags.json",
                "module_mapping_url": "https://raw.githubusercontent.com/NaaVRE/NaaVRE-conf/main/module_mapping.json",
